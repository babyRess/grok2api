services:
  open-grok-build:
    build: .
    image: open-grok-build:local
    restart: unless-stopped
    ports:
      - "${GROK_BUILD_API_PORT:-8990}:${GROK_BUILD_API_PORT:-8990}"
      - "${GROK_BUILD_CALLBACK_PUBLIC_PORT:-56122}:${GROK_BUILD_CALLBACK_PORT:-56122}"
    volumes:
      - ./data:/data
    environment:
      GROK_BUILD_API_HOST: 0.0.0.0
      GROK_BUILD_API_PORT: ${GROK_BUILD_API_PORT:-8990}
      GROK_BUILD_OAUTH_TOKEN: ${GROK_BUILD_OAUTH_TOKEN:-}
      GROK_BUILD_ACCESS_TOKEN: ${GROK_BUILD_ACCESS_TOKEN:-}
      GROK_BUILD_ACCOUNTS: ${GROK_BUILD_ACCOUNTS:-}
      GROK_BUILD_ACCOUNTS_FILE: ${GROK_BUILD_ACCOUNTS_FILE:-/data/accounts.json}
      GROK_BUILD_ACCOUNT_GROUP: ${GROK_BUILD_ACCOUNT_GROUP:-}
      GROK_BUILD_ACCOUNT_ROTATION: ${GROK_BUILD_ACCOUNT_ROTATION:-balanced}
      GROK_BUILD_LOAD_BALANCING_MODE: ${GROK_BUILD_LOAD_BALANCING_MODE:-}
      GROK_BUILD_ACCOUNT_RETRIES: ${GROK_BUILD_ACCOUNT_RETRIES:-3}
      GROK_BUILD_ACCOUNT_REQUEST_RETRIES: ${GROK_BUILD_ACCOUNT_REQUEST_RETRIES:-9}
      GROK_BUILD_API_KEY: ${GROK_BUILD_API_KEY:-}
      GROK_BUILD_BASE_URL: ${GROK_BUILD_BASE_URL:-https://cli-chat-proxy.grok.com/v1}
      GROK_BUILD_MODELS: ${GROK_BUILD_MODELS:-}
      GROK_BUILD_WEB_SEARCH_ENDPOINT: ${GROK_BUILD_WEB_SEARCH_ENDPOINT:-}
      GROK_BUILD_WEB_SEARCH_API_KEY: ${GROK_BUILD_WEB_SEARCH_API_KEY:-}
      GROK_BUILD_WEB_SEARCH_AUTH_HEADER: ${GROK_BUILD_WEB_SEARCH_AUTH_HEADER:-}
      GROK_BUILD_WEB_SEARCH_MAX_RESULTS: ${GROK_BUILD_WEB_SEARCH_MAX_RESULTS:-5}
      GROK_BUILD_BRAVE_SEARCH_API_KEY: ${GROK_BUILD_BRAVE_SEARCH_API_KEY:-}
      GROK_BUILD_BRAVE_SEARCH_ENDPOINT: ${GROK_BUILD_BRAVE_SEARCH_ENDPOINT:-}
      GROK_BUILD_CALLBACK_HOST: ${GROK_BUILD_CALLBACK_HOST:-0.0.0.0}
      GROK_BUILD_CALLBACK_PORT: ${GROK_BUILD_CALLBACK_PORT:-56122}
      GROK_BUILD_CALLBACK_PUBLIC_HOST: ${GROK_BUILD_CALLBACK_PUBLIC_HOST:-}
      GROK_BUILD_CALLBACK_PUBLIC_PORT: ${GROK_BUILD_CALLBACK_PUBLIC_PORT:-56122}
      GROK_BUILD_CALLBACK_PROTOCOL: ${GROK_BUILD_CALLBACK_PROTOCOL:-http}
      GROK_BUILD_CALLBACK_URL: ${GROK_BUILD_CALLBACK_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "--eval",
          "fetch('http://127.0.0.1:' + (process.env.GROK_BUILD_API_PORT || '8990') + '/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
